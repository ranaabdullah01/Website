<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Futures Signal Bot · Binance Free</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0d13;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
      color: #eef2ff;
      padding: 20px;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #11141c; }
    ::-webkit-scrollbar-thumb { background: #2c3348; border-radius: 6px; }

    /* main container */
    .app {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #4f8ef7, #9b6eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .free-badge {
      background: #1f2a3e;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #9bb8ff;
      border: 1px solid #2c3f5f;
    }
    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #11141c;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
    }
    .pulse {
      width: 10px;
      height: 10px;
      background-color: #1fd47a;
      border-radius: 50%;
      box-shadow: 0 0 6px #1fd47a;
      animation: pulse-animation 1.4s infinite;
    }
    @keyframes pulse-animation {
      0% { opacity: 0.4; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1.2);}
    }

    /* ticker row */
    .ticker-bar {
      background: #11141c;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 20px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 24px;
    }
    .ticker-item {
      display: inline-flex;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      background: #181c27;
      padding: 5px 15px;
      border-radius: 30px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      background: #11141c;
      padding: 12px 20px;
      border-radius: 28px;
      margin-bottom: 20px;
    }
    select, button {
      background: #181c27;
      border: 1px solid #2c3348;
      color: white;
      padding: 8px 16px;
      border-radius: 28px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #2a3146;
      border-color: #4f8ef7;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #11141c;
      border-radius: 20px;
      padding: 14px;
      border-left: 3px solid #4f8ef7;
    }
    .grid-coins {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }
    .coin-card {
      background: #11141c;
      border-radius: 24px;
      padding: 14px 16px;
      transition: 0.1s;
      cursor: pointer;
      border-left: 6px solid #4f8ef7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .score-badge {
      font-weight: 700;
      background: #181c27;
      padding: 2px 10px;
      border-radius: 60px;
      font-size: 0.8rem;
    }
    .price-main {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 8px 0 4px;
    }
    .mini-indicators {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0;
      font-size: 0.7rem;
      font-family: monospace;
    }
    .signal-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .progress-bar {
      background: #2a2f3f;
      border-radius: 20px;
      height: 6px;
      width: 100%;
      margin-top: 8px;
    }
    .progress-fill {
      background: #4f8ef7;
      height: 6px;
      border-radius: 20px;
      width: 0%;
    }
    .detail-panel {
      background: #11141c;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 30px;
      display: none;
      border: 1px solid #2c3348;
    }
    .history-table {
      background: #11141c;
      border-radius: 24px;
      overflow-x: auto;
      padding: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
    }
    th, td {
      text-align: left;
      padding: 10px 6px;
      border-bottom: 1px solid #1e2433;
    }
    .text-green { color: #1fd47a; }
    .text-red { color: #f04f4f; }
    .text-amber { color: #f5a623; }
    .skeleton {
      background: #181c27;
      border-radius: 20px;
      height: 160px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 0.9; }
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .price-main { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo-area">
      <span class="logo">⚡ CRYPTO SIGNAL BOT</span>
      <span class="free-badge">FREE · NO API KEY</span>
    </div>
    <div class="live-dot"><span class="pulse"></span> <span id="liveTimestamp">--:--:--</span></div>
  </div>
  <div class="ticker-bar" id="tickerBar">Loading ticker...</div>
  <div class="controls">
    <select id="tfSelect"><option value="5m" selected>5m</option><option value="1m">1m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option></select>
    <select id="countSelect"><option value="8">8 pairs</option><option value="12" selected>12 pairs</option><option value="20">20 pairs</option></select>
    <select id="filterScore"><option value="0">All scores</option><option value="50">≥50</option><option value="65" selected>≥65</option><option value="80">≥80</option></select>
    <button id="refreshBtn">⟳ Refresh now</button>
    <span id="updateTime" style="font-size:0.75rem;">last update: --</span>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div id="cardsGrid" class="grid-coins">Loading signals...</div>
  <div id="detailPanel" class="detail-panel"></div>
  <div class="history-table"><h4 style="margin-bottom:8px;">📋 Signal history log</h4><div style="overflow-x:auto"><table id="historyTable"><thead><tr><th>Time</th><th>Pair</th><th>TF</th><th>Signal</th><th>Score</th><th>Price</th><th>SL</th><th>TP</th><th>R:R</th><th>Patterns</th></tr></thead><tbody></tbody></table></div></div>
</div>
<script>
  // ---------- CONSTANTS ----------
  const SYMBOLS = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","MATICUSDT","DOTUSDT","LINKUSDT","LTCUSDT","UNIUSDT","ATOMUSDT","NEARUSDT","FILUSDT","APTUSDT","ARBUSDT","OPUSDT","INJUSDT"];
  const MAX_PAIRS = 20;
  let currentTimeframe = "5m";
  let currentLimit = 12;
  let minScoreFilter = 65;
  let allSignals = [];      // store signal objects per pair
  let selectedPair = null;
  let historyLogs = [];     // {time,pair,tf,signal,score,price,sl,tp,rr,patterns}
  let refreshInterval = null;

  // helper: format price
  function formatPrice(price) {
    if (price >= 1000) return "$" + price.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    if (price >= 1) return "$" + price.toFixed(4);
    return "$" + price.toFixed(6);
  }
  function formatPercent(p) { let s = p.toFixed(2); return (p>=0?`+${s}`:`${s}`)+"%"; }

  // ----- Technical indicators (pure JS, no libs) -----
  function calcEMA(prices, period) {
    const k = 2/(period+1);
    let ema = prices[0];
    for(let i=1;i<prices.length;i++) ema = prices[i]*k + ema*(1-k);
    return ema;
  }
  function calcRSI(closes, period=14) {
    let gains=0,losses=0;
    for(let i=closes.length-period;i<closes.length;i++) {
      let delta = closes[i]-closes[i-1];
      if(delta>=0) gains+=delta; else losses-=delta;
    }
    let avgGain=gains/period, avgLoss=losses/period;
    let rs=avgGain/avgLoss; let rsi=100-(100/(1+rs));
    return isNaN(rsi)?50:rsi;
  }
  function calcMACD(closes, fast=12, slow=26, signal=9) {
    let emaFast=calcEMA(closes.slice(0,fast),fast);
    let emaSlow=calcEMA(closes.slice(0,slow),slow);
    let macdLine=emaFast-emaSlow;
    let hist=0;
    return {macdLine, histogram:hist, signalLine:0}; // reduced but we compute direction using history? simpler: using last diff
  }
  // full macd with array
  function getMACDValues(closes) {
    let emaFast = calcEMA(closes.slice(0,12),12);
    let emaSlow = calcEMA(closes.slice(0,26),26);
    let macdLine = emaFast-emaSlow;
    let hist = macdLine; // mock for hist trend: real requires signal ema but we can compute hist = macd - signal (simplified but robust)
    // we will recompute using signal ema of macd line
    let macdArr = [];
    for(let i=26;i<=closes.length;i++){
      let f=calcEMA(closes.slice(0,i),12);
      let s=calcEMA(closes.slice(0,i),26);
      macdArr.push(f-s);
    }
    let signalLine = calcEMA(macdArr,9);
    let histogram = macdArr[macdArr.length-1] - signalLine;
    return { macdLine: macdArr[macdArr.length-1], histogram, signalLine };
  }
  function calcBollinger(closes, period=20, stdDev=2) {
    let last = closes[closes.length-1];
    let slice=closes.slice(-period);
    let mean=slice.reduce((a,b)=>a+b,0)/period;
    let variance=slice.map(x=>(x-mean)**2).reduce((a,b)=>a+b,0)/period;
    let std=Math.sqrt(variance);
    let upper=mean+stdDev*std, lower=mean-stdDev*std;
    let pos = (last-lower)/(upper-lower)*100;
    return {upper,lower,mid:mean, position:Math.min(100,Math.max(0,pos))};
  }
  function calcATR(highs, lows, closes, period=14) {
    let tr=[]; for(let i=1;i<highs.length;i++) tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
    let atr=tr.slice(-period).reduce((a,b)=>a+b,0)/period;
    return atr;
  }
  function calcStochRSI(closes, period=14) {
    let rsiArr=[];
    for(let i=period;i<=closes.length;i++) rsiArr.push(calcRSI(closes.slice(0,i),period));
    let last=rsiArr[rsiArr.length-1];
    let lowest=Math.min(...rsiArr.slice(-period)), highest=Math.max(...rsiArr.slice(-period));
    let stoch=(last-lowest)/(highest-lowest)*100;
    return isNaN(stoch)?50:stoch;
  }
  function volumeOscillator(volumes, fast=5, slow=20) {
    if(volumes.length<slow) return 0;
    let fastAvg=volumes.slice(-fast).reduce((a,b)=>a+b,0)/fast;
    let slowAvg=volumes.slice(-slow).reduce((a,b)=>a+b,0)/slow;
    return ((fastAvg-slowAvg)/slowAvg)*100;
  }
  // candlestick pattern detection (simplified)
  function detectPatterns(klines) {
    let patterns=[];
    let len=klines.length;
    if(len<3) return patterns;
    let c1=klines[len-1], c2=klines[len-2], c3=klines[len-3];
    let body1=Math.abs(c1.close-c1.open), upperShadow1=c1.high-Math.max(c1.open,c1.close), lowerShadow1=Math.min(c1.open,c1.close)-c1.low;
    let body2=Math.abs(c2.close-c2.open);
    // Hammer
    if(body1>0 && lowerShadow1>=2*body1 && upperShadow1<body1*0.3) patterns.push({name:"Hammer",bullish:true});
    // Shooting star
    if(body1>0 && upperShadow1>=2*body1 && lowerShadow1<body1*0.3) patterns.push({name:"Shooting star",bullish:false});
    // Doji
    if(body1<(c1.high-c1.low)*0.1) patterns.push({name:"Doji",bullish:null});
    // Bullish engulfing
    if(c2.close<c2.open && c1.close>c1.open && c1.close>c2.open && c1.open<c2.close) patterns.push({name:"Bullish engulf",bullish:true});
    // Bearish engulfing
    if(c2.close>c2.open && c1.close<c1.open && c1.close<c2.open && c1.open>c2.close) patterns.push({name:"Bearish engulf",bullish:false});
    return patterns;
  }
  // main signal calculation
  function computeSignal(pairData, closes, highs, lows, volumes) {
    let currentPrice=closes[closes.length-1];
    let ema9=calcEMA(closes,9), ema21=calcEMA(closes,21), ema50=calcEMA(closes,50);
    let bullScore=0, bearScore=0;
    // EMA 30pts
    if(ema9>ema21 && ema21>ema50) bullScore+=20; else if(ema9<ema21 && ema21<ema50) bearScore+=20;
    if(currentPrice>ema50) bullScore+=10; else if(currentPrice<ema50) bearScore+=10;
    // RSI 20pts
    let rsi=calcRSI(closes,14);
    if(rsi<35) bullScore+=15; else if(rsi>65) bearScore+=15;
    if(rsi>50) bullScore+=5; else if(rsi<50) bearScore+=5;
    // MACD 15pts
    let macdObj=getMACDValues(closes);
    if(macdObj.macdLine>0 && macdObj.histogram>0) bullScore+=15;
    else if(macdObj.macdLine<0 && macdObj.histogram<0) bearScore+=15;
    else if(macdObj.histogram>0) bullScore+=8; else if(macdObj.histogram<0) bearScore+=8;
    // Bollinger 15pts
    let bb=calcBollinger(closes);
    if(currentPrice<bb.lower) bullScore+=15; else if(currentPrice>bb.upper) bearScore+=15;
    else if(currentPrice>bb.mid) bullScore+=5; else if(currentPrice<bb.mid) bearScore+=5;
    // Volume 10pts
    let volRatio=volumes.slice(-5).reduce((a,b)=>a+b,0)/5 / (volumes.slice(-20,-5).reduce((a,b)=>a+b,0)/15);
    let volOsc=volumeOscillator(volumes);
    let dominantBull=bullScore>bearScore;
    if(volRatio>1.5 && dominantBull) bullScore+=10; else if(volRatio>1.5 && !dominantBull) bearScore+=10;
    if(volOsc>5 && dominantBull) bullScore+=5; else if(volOsc>5 && !dominantBull) bearScore+=5;
    // StochRSI 5pts
    let stoch=calcStochRSI(closes);
    if(stoch<20) bullScore+=5; else if(stoch>80) bearScore+=5;
    // patterns 10pts
    let patterns=detectPatterns(closes.map((c,i)=>({open:pairData.opens?pairData.opens[i]:c, high:pairData.highs?pairData.highs[i]:c, low:pairData.lows?pairData.lows[i]:c, close:c})));
    let pattBull=patterns.filter(p=>p.bullish===true).length*5;
    let pattBear=patterns.filter(p=>p.bullish===false).length*5;
    bullScore+=pattBull; bearScore+=pattBear;
    let net=bullScore-bearScore;
    let finalSignal="NEUTRAL", score=bullScore, bearFinal=bearScore;
    if(net>=20){ finalSignal="LONG"; score=bullScore; } 
    else if(net<=-20){ finalSignal="SHORT"; score=bearScore; }
    else finalSignal="NEUTRAL";
    let confidence = score>=80?"High":(score>=65?"Medium":"Low");
    // ATR + SL/TP
    let atr=calcATR(highs,lows,closes,14);
    let entry=currentPrice;
    let sl, tp1, tp2, rr;
    if(finalSignal==="LONG"){
      sl=entry-atr*1.8; tp1=entry+atr*2.5; tp2=entry+atr*4;
      rr=((tp1-entry)/(entry-sl)).toFixed(2);
    } else if(finalSignal==="SHORT"){
      sl=entry+atr*1.8; tp1=entry-atr*2.5; tp2=entry-atr*4;
      rr=((entry-tp1)/(sl-entry)).toFixed(2);
    } else { sl=tp1=tp2=0; rr="0";}
    return {signal:finalSignal, score, confidence, rsi, macdHist:macdObj.histogram, stoch, bbPos:bb.position, volRatio, atr, entry, sl, tp1, tp2, rr, patterns, bullScore:bullScore, bearScore:bearScore, currentPrice, netScore:net};
  }

  // fetch klines & ticker
  async function fetchPairData(symbol, tf){
    let urlKlines=`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${tf}&limit=100`;
    let urlTicker=`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${symbol}`;
    let [kRes, tRes]=await Promise.all([fetch(urlKlines), fetch(urlTicker)]);
    let kData=await kRes.json(); let tick=await tRes.json();
    let closes=[], highs=[], lows=[], volumes=[], opens=[];
    for(let k of kData){ opens.push(parseFloat(k[1])); highs.push(parseFloat(k[2])); lows.push(parseFloat(k[3])); closes.push(parseFloat(k[4])); volumes.push(parseFloat(k[5])); }
    let priceChange=parseFloat(tick.priceChangePercent);
    let lastPrice=parseFloat(tick.lastPrice);
    return {closes,highs,lows,volumes,opens, priceChange, lastPrice, symbol};
  }

  async function fetchAllSignals(){
    let symbolsToUse=SYMBOLS.slice(0,currentLimit);
    let results=[];
    for(let sym of symbolsToUse){
      try{
        let data=await fetchPairData(sym,currentTimeframe);
        let signal=computeSignal(data, data.closes, data.highs, data.lows, data.volumes);
        results.push({symbol:sym, price:data.lastPrice, change:data.priceChange, ...signal});
      }catch(e){ console.warn(sym,e); results.push({symbol:sym, price:0, change:0, signal:"NEUTRAL", score:0});}
    }
    allSignals=results;
    renderUI();
  }

  // UI rendering
  function renderUI(){
    updateTickerBar();
    updateStatsAndGrid();
    if(selectedPair) showDetailPanel(selectedPair);
    else document.getElementById("detailPanel").style.display="none";
    document.getElementById("updateTime").innerText=new Date().toLocaleTimeString();
    document.getElementById("liveTimestamp").innerText=new Date().toLocaleTimeString();
  }
  function updateTickerBar(){
    let bar=document.getElementById("tickerBar");
    let top8=allSignals.slice(0,8);
    bar.innerHTML=top8.map(s=>`<div class="ticker-item"><strong>${s.symbol}</strong> ${formatPrice(s.price)} <span class="${s.change>=0?'text-green':'text-red'}">${formatPercent(s.change)}</span></div>`).join('');
  }
  function updateStatsAndGrid(){
    let longs=allSignals.filter(s=>s.signal==="LONG").length;
    let shorts=allSignals.filter(s=>s.signal==="SHORT").length;
    let neut=allSignals.filter(s=>s.signal==="NEUTRAL").length;
    let avgScore=allSignals.reduce((a,b)=>a+(b.score||0),0)/(allSignals.length||1);
    let best=allSignals.reduce((a,b)=>((b.score||0)>(a.score||0)?b:a),{symbol:"-",score:0,signal:""});
    document.getElementById("statsRow").innerHTML=`<div class="stat-card">🟢 LONG: ${longs}</div><div class="stat-card">🔴 SHORT: ${shorts}</div><div class="stat-card">⚪ NEUTRAL: ${neut}</div><div class="stat-card">📊 Avg Score: ${avgScore.toFixed(0)}</div><div class="stat-card">🏆 Best: ${best.symbol} ${best.signal} (${best.score})</div>`;
    let filtered=allSignals.filter(s=>s.score>=minScoreFilter);
    let grid=document.getElementById("cardsGrid");
    if(filtered.length===0 && allSignals.length>0) grid.innerHTML="<div style='padding:20px; background:#111; border-radius:32px;'>⚠️ No pairs meet min score filter. Lower filter or refresh.</div>";
    else grid.innerHTML=filtered.map(s=>`<div class="coin-card" data-pair="${s.symbol}" style="border-left-color: ${s.signal==='LONG'?'#1fd47a':(s.signal==='SHORT'?'#f04f4f':'#f5a623')}"><div class="card-header"><strong>${s.symbol}</strong><span class="score-badge" style="color:${s.score>=80?'#1fd47a':(s.score>=65?'#f5a623':'#aaa')}">${s.score}/100</span></div><div class="price-main">${formatPrice(s.price)}</div><div><span class="${s.change>=0?'text-green':'text-red'}">${formatPercent(s.change)}</span> 24h</div><div class="mini-indicators">RSI:${s.rsi?.toFixed(0)} | MACD:${s.macdHist>0?"▲":"▼"} | Vol:${s.volRatio?.toFixed(1)}x | Stoch:${s.stoch?.toFixed(0)} | BB:${s.bbPos?.toFixed(0)}%</div><div><span class="signal-badge" style="background:${s.signal==='LONG'?'#1fd47a20':(s.signal==='SHORT'?'#f04f4f20':'#f5a62320')}; color:${s.signal==='LONG'?'#1fd47a':(s.signal==='SHORT'?'#f04f4f':'#f5a623')}">${s.signal}</span><div class="progress-bar"><div class="progress-fill" style="width:${s.score}%; background:${s.signal==='LONG'?'#1fd47a':(s.signal==='SHORT'?'#f04f4f':'#f5a623')}"></div></div></div></div>`).join('');
    document.querySelectorAll(".coin-card").forEach(card=>card.addEventListener("click",()=>{selectedPair=card.getAttribute("data-pair"); showDetailPanel(allSignals.find(s=>s.symbol===selectedPair));}));
  }
  function showDetailPanel(signalObj){
    if(!signalObj) return;
    let panel=document.getElementById("detailPanel");
    let patternsStr=signalObj.patterns?.map(p=>p.name).join(", ")||"none";
    let patternsHtml=signalObj.patterns?.map(p=>`<span style="background:${p.bullish===true?'#1fd47a30':(p.bullish===false?'#f04f4f30':'#555530')}; padding:2px 8px; border-radius:20px;">${p.name}</span>`).join(" ")||"none";
    let indicatorBreakdown=`<div class="mini-indicators" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;"><div>📈 RSI: ${signalObj.rsi?.toFixed(1)} (${signalObj.rsi<35?"oversold":signalObj.rsi>65?"overbought":"neutral"})</div><div>📊 MACD: ${signalObj.macdHist>0?"bullish":"bearish"} hist</div><div>📦 Bollinger Pos: ${signalObj.bbPos?.toFixed(0)}%</div><div>⚡ StochRSI: ${signalObj.stoch?.toFixed(0)}</div><div>📀 Volume ratio: ${signalObj.volRatio?.toFixed(2)}x</div><div>💹 ATR: $${signalObj.atr?.toFixed(4)}</div></div>`;
    panel.style.display="block";
    panel.innerHTML=`<div style="display:flex;justify-content:space-between;"><h3>${signalObj.symbol} · ${signalObj.signal} · score ${signalObj.score}</h3><button id="closeDetail" style="background:#2c3348;">✖</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0;">
      <div>Signal: ${signalObj.signal}</div><div>Score: ${signalObj.score}</div><div>Entry: ${formatPrice(signalObj.entry)}</div><div>SL: ${formatPrice(signalObj.sl)}</div><div>TP1: ${formatPrice(signalObj.tp1)}</div><div>TP2: ${formatPrice(signalObj.tp2)}</div><div>R:R: 1:${signalObj.rr}</div><div>ATR: $${signalObj.atr?.toFixed(4)}</div>
    </div>
    <div>✨ Patterns: ${patternsHtml}</div>
    ${indicatorBreakdown}
    <div style="border-left: 3px solid #4f8ef7; background:#181c27; padding:12px; margin-top:12px;">
      <strong>Analysis:</strong> RSI at ${signalObj.rsi?.toFixed(0)}. ${signalObj.macdHist>0?"MACD histogram positive":"MACD negative"}. Bollinger bands position ${signalObj.bbPos?.toFixed(0)}%. Volume ${signalObj.volRatio>1.2?"increasing":"stable"}. Pattern signals: ${patternsStr}. <span style="color:#f5a623;">⚠️ Risk: Crypto futures are highly volatile. DYOR.</span>
    </div>`;
    document.getElementById("closeDetail")?.addEventListener("click",()=>{selectedPair=null; panel.style.display="none";});
    // add history log when card clicked
    let now=new Date().toLocaleTimeString();
    let lastLog=historyLogs[0];
    if(!lastLog || lastLog.pair!==signalObj.symbol || (Date.now()-lastLog.ts)>60000){
      historyLogs.unshift({time:now,pair:signalObj.symbol,tf:currentTimeframe,signal:signalObj.signal,score:signalObj.score,price:formatPrice(signalObj.price),sl:formatPrice(signalObj.sl),tp:formatPrice(signalObj.tp1),rr:`1:${signalObj.rr}`,patterns:patternsStr,ts:Date.now()});
      if(historyLogs.length>30) historyLogs.pop();
      renderHistory();
    }
  }
  function renderHistory(){
    let tbody=document.querySelector("#historyTable tbody");
    tbody.innerHTML=historyLogs.map(h=>`<tr><td>${h.time}</td><td>${h.pair}</td><td>${h.tf}</td><td class="${h.signal==='LONG'?'text-green':(h.signal==='SHORT'?'text-red':'text-amber')}">${h.signal}</td><td>${h.score}</td><td>${h.price}</td><td>${h.sl}</td><td>${h.tp}</td><td>${h.rr}</td><td>${h.patterns.slice(0,20)}</td></tr>`).join('');
  }
  function refreshAll(){
    fetchAllSignals().catch(e=>console.warn);
  }
  // init + autofetch/interval
  function init(){
    currentTimeframe=document.getElementById("tfSelect").value;
    currentLimit=parseInt(document.getElementById("countSelect").value);
    minScoreFilter=parseInt(document.getElementById("filterScore").value);
    refreshAll();
    if(refreshInterval) clearInterval(refreshInterval);
    refreshInterval=setInterval(()=>refreshAll(),30000);
    document.getElementById("tfSelect").addEventListener("change",()=>{currentTimeframe=document.getElementById("tfSelect").value; refreshAll();});
    document.getElementById("countSelect").addEventListener("change",()=>{currentLimit=parseInt(document.getElementById("countSelect").value); refreshAll();});
    document.getElementById("filterScore").addEventListener("change",()=>{minScoreFilter=parseInt(document.getElementById("filterScore").value); renderUI();});
    document.getElementById("refreshBtn").addEventListener("click",()=>refreshAll());
  }
  init();
</script>
</body>
</html>
