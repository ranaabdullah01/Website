<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Futures Trading Bot - 4 Assets Live</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card-bg: #12171f;
            --border: #1a2332;
            --text: #dde4f0;
            --text-dim: #6b7394;
            --green: #00d4aa;
            --red: #ff4757;
            --blue: #4dabf7;
            --gold: #ffa94d;
            --accent: #748ffc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header h1 span { color: var(--accent); }
        .account-info {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .account-item {
            text-align: right;
        }
        .account-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }
        .account-value {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }
        .account-value.up { color: var(--green); }
        .account-value.down { color: var(--red); }

        /* Main Grid - 4 Asset Cards */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 1200px) {
            .assets-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 700px) {
            .assets-grid { grid-template-columns: 1fr; }
        }

        /* Asset Card */
        .asset-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .asset-card.has-position {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(116, 143, 252, 0.08);
        }
        .asset-card.has-position.long {
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.1);
        }
        .asset-card.has-position.short {
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.1);
        }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .asset-name {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .asset-symbol {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: rgba(255,255,255,0.04);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .asset-price {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            margin-bottom: 4px;
        }
        .asset-change {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .asset-change.up { color: var(--green); }
        .asset-change.down { color: var(--red); }

        /* Signal Badge */
        .signal-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .signal-badge.buy {
            background: rgba(0, 212, 170, 0.12);
            color: var(--green);
            border: 1px solid rgba(0, 212, 170, 0.25);
        }
        .signal-badge.sell {
            background: rgba(255, 71, 87, 0.12);
            color: var(--red);
            border: 1px solid rgba(255, 71, 87, 0.25);
        }
        .signal-badge.wait {
            background: rgba(255, 169, 77, 0.1);
            color: var(--gold);
            border: 1px solid rgba(255, 169, 77, 0.2);
        }

        /* Position Info */
        .position-info {
            display: none;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }
        .position-info.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .position-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.82rem;
        }
        .position-label {
            color: var(--text-dim);
        }
        .position-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }
        .position-value.profit { color: var(--green); font-size: 1rem; }
        .position-value.loss { color: var(--red); font-size: 1rem; }

        .pnl-display {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            padding: 10px 0;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }
        .pnl-display.profit { color: var(--green); }
        .pnl-display.loss { color: var(--red); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            font-family: inherit;
            text-transform: uppercase;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn.enter-long {
            background: rgba(0, 212, 170, 0.15);
            color: var(--green);
            border: 1px solid rgba(0, 212, 170, 0.3);
        }
        .btn.enter-long:hover:not(:disabled) {
            background: rgba(0, 212, 170, 0.25);
        }
        .btn.enter-short {
            background: rgba(255, 71, 87, 0.15);
            color: var(--red);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .btn.enter-short:hover:not(:disabled) {
            background: rgba(255, 71, 87, 0.25);
        }
        .btn.close-trade {
            background: rgba(255, 169, 77, 0.15);
            color: var(--gold);
            border: 1px solid rgba(255, 169, 77, 0.3);
        }
        .btn.close-trade:hover {
            background: rgba(255, 169, 77, 0.25);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-row .btn {
            flex: 1;
        }

        /* Active Trades Summary */
        .trades-summary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .summary-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 14px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            text-align: center;
        }
        @media (max-width: 700px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }
        .summary-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Pulsing dot for live */
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-gold { color: var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><span>◆</span> Futures Trading Bot</h1>
            <div class="account-info">
                <div class="account-item">
                    <div class="account-label">Balance</div>
                    <div class="account-value" id="balance">$10,000.00</div>
                </div>
                <div class="account-item">
                    <div class="account-label">Total P&L</div>
                    <div class="account-value" id="totalPnl" style="color:var(--text-dim);">$0.00</div>
                </div>
                <div class="account-item">
                    <div class="account-label">Open Trades</div>
                    <div class="account-value" id="openTradesCount" style="color:var(--accent);">0</div>
                </div>
            </div>
        </div>

        <!-- Summary Bar -->
        <div class="trades-summary">
            <div class="summary-title"><span class="live-dot"></span>Live Trading Summary</div>
            <div class="summary-grid">
                <div>
                    <div class="summary-value" id="totalUnrealizedPnl" style="color:var(--text-dim);">$0.00</div>
                    <div class="summary-label">Unrealized P&L</div>
                </div>
                <div>
                    <div class="summary-value" id="totalMargin" style="color:var(--blue);">$0.00</div>
                    <div class="summary-label">Margin Used</div>
                </div>
                <div>
                    <div class="summary-value" id="winRate">--</div>
                    <div class="summary-label">Win Rate</div>
                </div>
                <div>
                    <div class="summary-value" id="todayTrades">0</div>
                    <div class="summary-label">Today's Trades</div>
                </div>
            </div>
        </div>

        <!-- 4 Asset Cards -->
        <div class="assets-grid" id="assetsGrid">
            <!-- Dynamically generated -->
        </div>
    </div>

    <script>
        // ============================================================
        // CRYPTO FUTURES TRADING BOT - 4 ASSETS WITH LIVE P&L
        // ============================================================

        // ---- Configuration ----
        const CONFIG = {
            leverage: 5,
            riskPerTrade: 0.02, // 2% risk per trade
            updateInterval: 1500, // Update every 1.5 seconds
            assets: [
                { name: 'Bitcoin', symbol: 'BTC/USDT', icon: '₿', basePrice: 67500, volatility: 0.0015 },
                { name: 'Ethereum', symbol: 'ETH/USDT', icon: 'Ξ', basePrice: 3450, volatility: 0.0020 },
                { name: 'Solana', symbol: 'SOL/USDT', icon: '◎', basePrice: 145, volatility: 0.0028 },
                { name: 'BNB', symbol: 'BNB/USDT', icon: '⬡', basePrice: 580, volatility: 0.0018 }
            ]
        };

        // ---- Global State ----
        const STATE = {
            balance: 10000,
            startingBalance: 10000,
            totalPnl: 0,
            wins: 0,
            losses: 0,
            todayTrades: 0,
            assets: {}, // { symbol: { price, change, signal, position } }
            positions: [] // Array of open positions
        };

        // ---- Initialize Assets ----
        CONFIG.assets.forEach(asset => {
            STATE.assets[asset.symbol] = {
                ...asset,
                price: asset.basePrice,
                change: 0,
                signal: null, // { direction: 'buy'|'sell'|'wait', strength: 1-10, reason: '' }
                position: null, // { side: 'long'|'short', entryPrice, size, stopLoss, takeProfit, liquidationPrice }
                priceHistory: []
            };
        });

        // ---- Price Generation (Simulated - Replace with API) ----
        function updatePrices() {
            Object.values(STATE.assets).forEach(asset => {
                // Random walk price
                const change = (Math.random() - 0.5) * asset.volatility * asset.price;
                asset.price += change;
                asset.change = ((asset.price - asset.basePrice) / asset.basePrice) * 100;
                
                // Keep price history for signals (last 20 candles)
                asset.priceHistory.push(asset.price);
                if (asset.priceHistory.length > 50) asset.priceHistory.shift();
            });
        }

        // ---- Strategy: Generate Trade Signals ----
        function generateSignals() {
            Object.values(STATE.assets).forEach(asset => {
                if (asset.position) return; // Skip if already in position
                
                const prices = asset.priceHistory;
                if (prices.length < 20) {
                    asset.signal = { direction: 'wait', strength: 0, reason: 'Gathering data...' };
                    return;
                }

                // Calculate indicators
                const recentPrices = prices.slice(-20);
                const currentPrice = asset.price;
                
                // Simple Moving Averages
                const sma20 = recentPrices.reduce((a,b) => a+b, 0) / 20;
                const sma10 = recentPrices.slice(-10).reduce((a,b) => a+b, 0) / 10;
                
                // RSI (simplified)
                const gains = [], losses = [];
                for (let i = 1; i < recentPrices.length; i++) {
                    const diff = recentPrices[i] - recentPrices[i-1];
                    if (diff > 0) gains.push(diff); else losses.push(Math.abs(diff));
                }
                const avgGain = gains.length > 0 ? gains.reduce((a,b) => a+b, 0) / 14 : 0;
                const avgLoss = losses.length > 0 ? losses.reduce((a,b) => a+b, 0) / 14 : 0.0001;
                const rs = avgGain / avgLoss;
                const rsi = 100 - (100 / (1 + rs));
                
                // Bollinger Bands (simplified)
                const mean = sma20;
                const variance = recentPrices.reduce((sum, p) => sum + Math.pow(p - mean, 2), 0) / 20;
                const stdDev = Math.sqrt(variance);
                const bbUpper = mean + 2 * stdDev;
                const bbLower = mean - 2 * stdDev;
                
                // ATR (simplified)
                const trueRanges = [];
                for (let i = 1; i < Math.min(recentPrices.length, 14); i++) {
                    trueRanges.push(Math.abs(recentPrices[i] - recentPrices[i-1]));
                }
                const atr = trueRanges.length > 0 ? trueRanges.reduce((a,b) => a+b, 0) / trueRanges.length : currentPrice * 0.005;
                
                // ---- SIGNAL LOGIC ----
                let direction = 'wait';
                let strength = 0;
                const reasons = [];
                
                // Trend detection
                const trend = currentPrice > sma20 ? 'up' : 'down';
                const strongTrend = Math.abs(currentPrice - sma20) > atr * 1.5;
                
                // Mean reversion signals
                const oversold = rsi < 30 && currentPrice < bbLower;
                const overbought = rsi > 70 && currentPrice > bbUpper;
                
                // Momentum signals
                const bullishCross = sma10 > sma20 && prices[prices.length - 2] <= prices[prices.length - 3];
                const bearishCross = sma10 < sma20 && prices[prices.length - 2] >= prices[prices.length - 3];
                
                if (oversold && trend === 'up') {
                    direction = 'buy';
                    strength = 8;
                    reasons.push('RSI Oversold + Uptrend');
                    reasons.push('Price below BB Lower');
                } else if (overbought && trend === 'down') {
                    direction = 'sell';
                    strength = 8;
                    reasons.push('RSI Overbought + Downtrend');
                    reasons.push('Price above BB Upper');
                } else if (bullishCross && strongTrend) {
                    direction = 'buy';
                    strength = 7;
                    reasons.push('Bullish MA Cross');
                    reasons.push('Strong trend momentum');
                } else if (bearishCross && strongTrend) {
                    direction = 'sell';
                    strength = 7;
                    reasons.push('Bearish MA Cross');
                    reasons.push('Strong trend momentum');
                } else if (oversold) {
                    direction = 'buy';
                    strength = 4;
                    reasons.push('Oversold (counter-trend)');
                    reasons.push('Weaker signal - caution');
                } else if (overbought) {
                    direction = 'sell';
                    strength = 4;
                    reasons.push('Overbought (counter-trend)');
                    reasons.push('Weaker signal - caution');
                } else {
                    reasons.push('No clear signal');
                    reasons.push(`RSI: ${rsi.toFixed(0)} | Trend: ${trend}`);
                }
                
                asset.signal = {
                    direction,
                    strength,
                    reason: reasons.join(' | '),
                    rsi: rsi.toFixed(0),
                    trend,
                    atr
                };
            });
        }

        // ---- Trade Execution ----
        function openTrade(symbol, side) {
            const asset = STATE.assets[symbol];
            if (asset.position) return; // Already in position
            if (STATE.balance <= 0) return;
            
            const price = asset.price;
            const atr = asset.signal?.atr || price * 0.008;
            const riskAmount = STATE.balance * CONFIG.riskPerTrade;
            
            // Calculate position size
            const stopDistance = atr * 2;
            const positionSize = (riskAmount * CONFIG.leverage) / (stopDistance / price * price);
            const notionalValue = positionSize * price / CONFIG.leverage; // Actual margin used
            
            if (notionalValue > STATE.balance * 0.25) return; // Max 25% of balance per trade
            
            // Create position
            const position = {
                id: Date.now(),
                symbol,
                side,
                entryPrice: price,
                size: positionSize,
                notionalValue,
                stopLoss: side === 'long' ? price - stopDistance : price + stopDistance,
                takeProfit: side === 'long' ? price + stopDistance * 2.5 : price - stopDistance * 2.5,
                liquidationPrice: side === 'long' ? price * (1 - 1/CONFIG.leverage) : price * (1 + 1/CONFIG.leverage),
                openTime: new Date(),
                pnl: 0,
                pnlPercent: 0
            };
            
            asset.position = position;
            STATE.positions.push(position);
            STATE.todayTrades++;
            
            // Deduct margin from available balance (simplified)
            STATE.balance -= notionalValue;
            
            updateUI();
        }

        function closeTrade(symbol) {
            const asset = STATE.assets[symbol];
            if (!asset.position) return;
            
            const position = asset.position;
            const exitPrice = asset.price;
            
            // Calculate final PnL
            let pnl;
            if (position.side === 'long') {
                pnl = (exitPrice - position.entryPrice) * position.size;
            } else {
                pnl = (position.entryPrice - exitPrice) * position.size;
            }
            
            // Return margin + PnL to balance
            STATE.balance += position.notionalValue + pnl;
            STATE.totalPnl += pnl;
            
            if (pnl > 0) STATE.wins++;
            else STATE.losses++;
            
            // Remove position
            asset.position = null;
            STATE.positions = STATE.positions.filter(p => p.id !== position.id);
            
            updateUI();
        }

        // ---- Update Position P&L ----
        function updatePositionPnL() {
            STATE.positions.forEach(position => {
                const asset = STATE.assets[position.symbol];
                const currentPrice = asset.price;
                
                if (position.side === 'long') {
                    position.pnl = (currentPrice - position.entryPrice) * position.size;
                } else {
                    position.pnl = (position.entryPrice - currentPrice) * position.size;
                }
                
                position.pnlPercent = (position.pnl / (position.notionalValue * CONFIG.leverage)) * 100;
                
                // Auto close: Stop Loss / Take Profit
                let shouldClose = false;
                if (position.side === 'long') {
                    if (currentPrice <= position.stopLoss) shouldClose = true;
                    if (currentPrice >= position.takeProfit) shouldClose = true;
                } else {
                    if (currentPrice >= position.stopLoss) shouldClose = true;
                    if (currentPrice <= position.takeProfit) shouldClose = true;
                }
                
                if (shouldClose) {
                    closeTrade(position.symbol);
                }
            });
        }

        // ---- UI Rendering ----
        function renderAssetCards() {
            const grid = document.getElementById('assetsGrid');
            
            grid.innerHTML = CONFIG.assets.map(asset => {
                const data = STATE.assets[asset.symbol];
                const hasPosition = !!data.position;
                const position = data.position;
                
                let positionClass = '';
                if (hasPosition && position.side === 'long') positionClass = 'has-position long';
                else if (hasPosition && position.side === 'short') positionClass = 'has-position short';
                
                // Signal badge
                let signalBadge = '';
                if (hasPosition) {
                    signalBadge = `<div class="signal-badge ${position.side === 'long' ? 'buy' : 'sell'}">
                        🔵 ${position.side.toUpperCase()} OPEN
                    </div>`;
                } else if (data.signal) {
                    const s = data.signal;
                    if (s.direction === 'buy' && s.strength >= 6) {
                        signalBadge = `<div class="signal-badge buy">🟢 STRONG BUY (${s.strength}/10)</div>`;
                    } else if (s.direction === 'buy') {
                        signalBadge = `<div class="signal-badge buy">🟡 BUY (${s.strength}/10)</div>`;
                    } else if (s.direction === 'sell' && s.strength >= 6) {
                        signalBadge = `<div class="signal-badge sell">🔴 STRONG SELL (${s.strength}/10)</div>`;
                    } else if (s.direction === 'sell') {
                        signalBadge = `<div class="signal-badge sell">🟠 SELL (${s.strength}/10)</div>`;
                    } else {
                        signalBadge = `<div class="signal-badge wait">⏳ WAIT</div>`;
                    }
                }
                
                // Position P&L display
                let positionHTML = '';
                if (hasPosition) {
                    const pnlClass = position.pnl >= 0 ? 'profit' : 'loss';
                    positionHTML = `
                        <div class="position-info active">
                            <div class="pnl-display ${pnlClass}">
                                ${position.pnl >= 0 ? '+' : ''}$${position.pnl.toFixed(2)}
                            </div>
                            <div class="pnl-display ${pnlClass}" style="font-size:1rem;">
                                (${position.pnlPercent >= 0 ? '+' : ''}${position.pnlPercent.toFixed(2)}%)
                            </div>
                            <div class="position-row">
                                <span class="position-label">Entry</span>
                                <span class="position-value">$${position.entryPrice.toFixed(2)}</span>
                            </div>
                            <div class="position-row">
                                <span class="position-label">Size</span>
                                <span class="position-value">${position.size.toFixed(4)}</span>
                            </div>
                            <div class="position-row">
                                <span class="position-label">Margin</span>
                                <span class="position-value">$${position.notionalValue.toFixed(2)}</span>
                            </div>
                            <div class="position-row">
                                <span class="position-label">Stop Loss</span>
                                <span class="position-value text-red">$${position.stopLoss.toFixed(2)}</span>
                            </div>
                            <div class="position-row">
                                <span class="position-label">Take Profit</span>
                                <span class="position-value text-green">$${position.takeProfit.toFixed(2)}</span>
                            </div>
                            <div class="position-row">
                                <span class="position-label">Liquidation</span>
                                <span class="position-value text-red">$${position.liquidationPrice.toFixed(2)}</span>
                            </div>
                            <button class="btn close-trade" onclick="closeTrade('${asset.symbol}')">
                                ⚡ CLOSE POSITION
                            </button>
                        </div>
                    `;
                }
                
                // Action buttons
                let actionButtons = '';
                if (!hasPosition && data.signal) {
                    const canBuy = data.signal.direction === 'buy';
                    const canSell = data.signal.direction === 'sell';
                    actionButtons = `
                        <div class="btn-row">
                            <button class="btn enter-long" onclick="openTrade('${asset.symbol}', 'long')" 
                                ${!canBuy ? 'disabled' : ''}>
                                📈 LONG
                            </button>
                            <button class="btn enter-short" onclick="openTrade('${asset.symbol}', 'short')" 
                                ${!canSell ? 'disabled' : ''}>
                                📉 SHORT
                            </button>
                        </div>
                    `;
                }
                
                return `
                    <div class="asset-card ${positionClass}">
                        <div class="asset-header">
                            <div class="asset-name">${asset.icon} ${asset.name}</div>
                            <div class="asset-symbol">${asset.symbol}</div>
                        </div>
                        <div class="asset-price">$${data.price.toFixed(2)}</div>
                        <div class="asset-change ${data.change >= 0 ? 'up' : 'down'}">
                            ${data.change >= 0 ? '▲' : '▼'} ${Math.abs(data.change).toFixed(2)}%
                        </div>
                        ${signalBadge}
                        ${hasPosition ? '' : `<div style="font-size:0.75rem; color:var(--text-dim); margin-bottom:8px;">${data.signal?.reason || ''}</div>`}
                        ${positionHTML}
                        ${actionButtons}
                    </div>
                `;
            }).join('');
        }

        function updateSummary() {
            // Total unrealized PnL
            const totalUnrealized = STATE.positions.reduce((sum, p) => sum + p.pnl, 0);
            const pnlEl = document.getElementById('totalUnrealizedPnl');
            pnlEl.textContent = (totalUnrealized >= 0 ? '+' : '') + '$' + totalUnrealized.toFixed(2);
            pnlEl.style.color = totalUnrealized >= 0 ? 'var(--green)' : 'var(--red)';
            
            // Total margin used
            const totalMargin = STATE.positions.reduce((sum, p) => sum + p.notionalValue, 0);
            document.getElementById('totalMargin').textContent = '$' + totalMargin.toFixed(2);
            
            // Win rate
            const totalTrades = STATE.wins + STATE.losses;
            document.getElementById('winRate').textContent = 
                totalTrades > 0 ? ((STATE.wins / totalTrades) * 100).toFixed(1) + '%' : '--';
            
            // Today's trades
            document.getElementById('todayTrades').textContent = STATE.todayTrades;
            
            // Balance
            document.getElementById('balance').textContent = '$' + STATE.balance.toFixed(2);
            
            // Total PnL
            const totalPnlEl = document.getElementById('totalPnl');
            totalPnlEl.textContent = (STATE.totalPnl >= 0 ? '+' : '') + '$' + STATE.totalPnl.toFixed(2);
            totalPnlEl.style.color = STATE.totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
            
            // Open trades count
            document.getElementById('openTradesCount').textContent = STATE.positions.length;
        }

        function updateUI() {
            updatePositionPnL();
            renderAssetCards();
            updateSummary();
        }

        // ---- Main Loop ----
        function mainLoop() {
            updatePrices();
            generateSignals();
            updatePositionPnL();
            updateUI();
        }

        // ---- Start Bot ----
        function init() {
            // Initial price history
            Object.values(STATE.assets).forEach(asset => {
                for (let i = 0; i < 30; i++) {
                    const noise = (Math.random() - 0.5) * asset.volatility * asset.price;
                    asset.priceHistory.push(asset.price + noise * (i - 15));
                }
            });
            
            updateUI();
            setInterval(mainLoop, CONFIG.updateInterval);
            console.log('🚀 Trading bot started - monitoring 4 assets');
        }

        init();
    </script>
</body>
</html>
